<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DF Academy 2018</title>
<meta name="theme-color" content="#1d3c96">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DF Academy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}

/* Colori sociali giallo e blu. Layout: registro da campo — barra squadra fissa in alto, schede a tab, righe-giocatore compatte pensate per il telefono a bordo campo */
:root{
  --bg:#f1f3fa; --surface:#ffffff; --surface-2:#e6eaf6; --line:#d3d9ec;
  --fg:#141c3a; --muted:#56608a; --ink:#1d3c96;
  --accent:#1d3c96; --accent-fg:#ffffff; --accent-soft:#dfe5f7; --yellow:#ffe500;
  --ok:#1f7a4a; --ok-soft:#dbf0e3; --warn:#9a6a00; --warn-soft:#fbefcf;
  --bad:#b23a2e; --bad-soft:#f8dfdb; --gold:#8a6d00; --gold-soft:#fff4a3;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1230; --surface:#141c42; --surface-2:#1b2552; --line:#2a3670;
  --fg:#e8ebf7; --muted:#a3acd3; --ink:#1d3c96;
  --accent:#ffe14d; --accent-fg:#141c3a; --accent-soft:#2e3360; --yellow:#ffe500;
  --ok:#6fd39c; --ok-soft:#1b3a33; --warn:#f0c25a; --warn-soft:#3a2f12;
  --bad:#f08a7e; --bad-soft:#40211d; --gold:#ffe14d; --gold-soft:#3d3a14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1230; --surface:#141c42; --surface-2:#1b2552; --line:#2a3670;
  --fg:#e8ebf7; --muted:#a3acd3; --ink:#1d3c96;
  --accent:#ffe14d; --accent-fg:#141c3a; --accent-soft:#2e3360; --yellow:#ffe500;
  --ok:#6fd39c; --ok-soft:#1b3a33; --warn:#f0c25a; --warn-soft:#3a2f12;
  --bad:#f08a7e; --bad-soft:#40211d; --gold:#ffe14d; --gold-soft:#3d3a14;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra squadra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#ffffff;border-bottom:4px solid var(--yellow)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.crest{width:40px;height:44px;flex:none;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.team{min-width:0;flex:1}
.team b{display:block;color:var(--yellow);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;line-height:1;text-transform:uppercase}
.team span{font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.who{font-size:13px;text-align:right;opacity:.9}
.who button{background:none;border:1px solid rgba(238,244,239,.35);color:#eef4ef;border-radius:999px;padding:3px 10px;font-size:12px;margin-top:3px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs.bot{display:none}
.tabs button{background:none;border:0;color:#eef4ef;opacity:.65;padding:10px 12px 11px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;color:var(--yellow);border-bottom-color:var(--yellow)}

main{padding-block:18px 110px}
h2{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.note{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:14px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}

/* navigazione settimana */
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .lbl{font-weight:700;min-width:150px;text-align:center}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.day b{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1}
.day small{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--line)}
.dot.ok{background:var(--ok)}

/* righe giocatore */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.abs{background:var(--bad-soft)}
.shirt{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].p{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed="true"].a{background:var(--bad);color:var(--surface)}
.motivo{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--bad);color:var(--bad)}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.savebar .grow{flex:1;min-width:0;font-size:14px;color:var(--muted)}

/* badge stato convocazione */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-doppia{background:var(--gold-soft);color:var(--gold)}
.b-conv{background:var(--ok-soft);color:var(--ok)}
.b-non{background:var(--bad-soft);color:var(--bad)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.ticks{display:inline-flex;gap:3px}
.tick{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.tick.y{background:var(--ok);color:var(--surface)}
.tick.n{background:var(--bad-soft);color:var(--bad)}

.groups{display:grid;gap:12px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.group header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.group header b{font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.group.g-doppia header{background:var(--gold-soft)}
.group.g-conv header{background:var(--ok-soft)}
.group.g-non header{background:var(--bad-soft)}
.group .count{font-family:var(--display);font-size:26px;font-weight:800}
.grow-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.grow-row:first-of-type{border-top:0}
.empty{padding:14px;color:var(--muted);font-size:14px}

/* tabelle */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr:first-child td{border-top:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.score{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em}

/* form */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.field input,.field select{box-sizing:border-box;min-width:0;max-width:100%;height:44px}
.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:1.2;padding-block:0}
.field input[type=date]::-webkit-date-and-time-value,.field input[type=time]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
input.mini{width:62px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;text-align:right}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}

/* scheda giocatore */
.card-head{display:flex;gap:14px;align-items:center}
.bigshirt{width:64px;height:64px;border-radius:14px;background:var(--ink);color:var(--yellow);box-shadow:inset 0 -5px 0 var(--yellow);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile b{display:block;font-family:var(--display);font-size:34px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:13px}
.meter{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.minbar{display:flex;align-items:center;gap:8px}
.minbar .track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:60px}
.minbar .track i{display:block;height:100%;background:var(--accent)}
.hist{display:flex;flex-wrap:wrap;gap:4px}
.hist .tick{width:auto;min-width:44px;padding:0 6px;height:26px;font-size:11px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login .panel{border-top:6px solid var(--yellow);width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.login h1{color:var(--accent);font-family:var(--display);font-size:40px;font-weight:800;text-transform:uppercase;line-height:.95;margin:0;letter-spacing:.02em}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.loading{color:var(--muted);padding:30px 0;text-align:center}
.ts{display:none}
@media (max-width:520px){
  body{font-size:14px}
  .who{display:flex;align-items:center;gap:8px}.who br{display:none}.who .nm{font-weight:700;font-size:12px;letter-spacing:.03em;color:var(--yellow,#ffe600);white-space:nowrap}
  .bar .wrap{gap:10px;padding-block:6px}
  .crest{width:30px;height:34px}
  .team b{font-size:19px}
  .team span{display:none}
  .who button{margin-top:0;padding:4px 10px}
  .tabs{gap:0;width:100%}
  .tabs button{flex:1 1 0;padding:9px 4px 10px;font-size:13px;text-align:center}
  .tl{display:none}.ts{display:inline}
  main{padding-block:12px 96px}
  h2{font-size:22px}
  .head{margin-bottom:8px;gap:8px;align-items:center}
  .head .sub{display:none}
  .stack{gap:12px}
  .panel{padding:12px;border-radius:12px}
  .btn{padding:8px 12px;font-size:13px}
  .weeknav .lbl{min-width:0;flex:1}
  .iconbtn{width:34px;height:34px}
  .days{gap:6px}
  .day{padding:8px;border-radius:10px}
  .day b{font-size:19px}
  .day small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow{grid-template-columns:28px minmax(0,1fr) auto;gap:8px;padding:8px 10px}
  .shirt{width:26px;height:26px;font-size:14px}
  .seg button{padding:7px 9px;font-size:12px}
  .motivo{grid-column:1 / -1}
  .savebar .wrap{gap:8px;padding-block:8px}
  .savebar .grow{font-size:12px;line-height:1.3}
  .grow-row{padding:8px 12px}
  .group header{padding:10px 12px}
  .group header b{font-size:18px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px 12px}
  .tile b{font-size:28px}
  .tile small{font-size:12px}
  .bigshirt{width:52px;height:52px;font-size:28px}
  .card-head{gap:10px}
  .hide-s{display:none}
  td,th{padding:8px 8px}
  .mtable table,.mtable tbody{display:block}
  .mtable thead{display:none}
  .mtable tr{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px 10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
  .mtable tr:first-child{border-top:0}
  .mtable td{display:block;padding:0;border:0}
  .mtable td:nth-child(3),.mtable td:nth-child(4){grid-column:2}
  .mtable td:nth-child(3):empty{display:none}
  .mtable tr:not(.on) td:nth-child(4){display:none}
  .mtable tr:not(.on){padding-block:8px}
  .mtable td.r .row{justify-content:flex-start!important}
  .mtable tr.on{grid-template-columns:auto minmax(0,1fr)}
  .mtable tr.on td:nth-child(1){grid-column:1/3}
  .mtable tr.on td:nth-child(2){grid-column:1}
  .mtable tr.on td:nth-child(3){grid-column:2}
  .mtable tr.on td.r .row{gap:6px}
  .mtable tr.on td.r input{width:72px}
  .mtable tr.on td.r input.gol{border-color:var(--gold)}
  .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
}
@media (prefers-reduced-motion:no-preference){.btn,.day,.seg button{transition:background .15s,border-color .15s}}

/* ---- look da app ---- */
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button,.tabs button,.btn,[data-a]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active,.btn:active{transform:scale(.97);transition:transform .08s}
input,select,textarea{font-size:16px}
body.is-login{background:linear-gradient(165deg,#2447b8 0%,#1d3c96 45%,#102564 100%);min-height:100vh}
body.is-login::before{background:transparent}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:32px}
.lhead{text-align:center;color:#fff}
.lhead .crest{width:104px;height:114px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));margin-bottom:6px}
.lhead h1{color:var(--yellow);font-family:var(--display);font-size:44px;font-weight:800;text-transform:uppercase;line-height:1;margin:6px 0 4px;letter-spacing:.03em}
.lsub{font-size:13px;opacity:.85;letter-spacing:.08em;text-transform:uppercase}
.login .panel{border-top:0;background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 18px 40px rgba(0,0,0,.35);max-width:380px;gap:14px}
.login .panel .btn.primary{background:var(--yellow);color:var(--ink);border:0;font-weight:800;font-size:16px;border-radius:14px;padding:13px}
.login input{border-radius:12px;padding:12px 14px}
@media (max-width:720px){
  .tl{display:none}.ts{display:inline}
  .tabs.top{display:none}
  .tabs.bot{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;width:auto;gap:0;overflow:visible;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs.bot button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-bottom:0;opacity:1;color:var(--muted);padding:2px 0;font-size:11px;font-weight:600}
  .tabs.bot button .ic{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
  .tabs.bot button[aria-selected="true"]{color:var(--fg);border-bottom:0}
  .tabs.bot button[aria-selected="true"] .ic{color:#14204f}
  .tabs.bot button[aria-selected="true"] .ic{background:var(--yellow)}
  .savebar{bottom:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:0;z-index:7;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
  main{padding-block:14px calc(150px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
.ver{text-align:center;font-size:11px;color:var(--muted);opacity:.6;margin:18px 0 0}
.dayh{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--muted);margin:18px 2px 2px}
.dayl{font-weight:700;font-size:14px;color:var(--muted);margin:12px 2px 6px;text-transform:capitalize}
.mcard{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px}
.mtime{font-weight:800;font-size:18px;color:var(--fg)}
.minfo b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.minfo small{color:var(--muted);font-size:13px}
.mres{text-align:right;font-family:var(--display);font-weight:800;font-size:24px;white-space:nowrap}

.gsum{display:flex;gap:10px;font-size:13px;font-weight:700;white-space:nowrap}
.chev{color:var(--muted);width:14px;text-align:center}
.gbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:9px}

const GRUPPI=[["gianni","MR Di Petrillo","g.dipetrillo"],["pierluigi","MR Lucatelli","p.lucatelli"],["riccardo","MR Verde","r.verde"]];
const gOf=u=>(GRUPPI.find(g=>g[2]===u)||[])[0]||"";

/* ---------- date ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const weekDays=mon=>[0,2,4].map(i=>iso(addDays(mon,i)));
const today=new Date(); const todayIso=iso(today);
const fmtDay=s=>parse(s).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
const fmtShort=s=>parse(s).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
const weekLabel=mon=>{const a=mon,b=addDays(mon,4);return a.getMonth()===b.getMonth()?a.getDate()+"–"+b.toLocaleDateString("it-IT",{day:"numeric",month:"short"}):fmtShort(iso(a))+" – "+fmtShort(iso(b))};
const DAYNAMES=["Lun","Mer","Ven"];
function defaultTrainingDate(){const ds=weekDays(monday(today));let pick=ds[0];ds.forEach(d=>{if(d<=todayIso)pick=d});return pick}
function matchWeek(dateIso){const d=parse(dateIso);const dow=d.getDay();/* sab/dom → settimana appena finita */return monday(dow===0||dow===6?d:d)}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let toastT;function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- stato ---------- */
const S={
  user:null,me:null,token:null,tab:"allenamenti",dbState:"loading",
  players:{},trainings:{},matches:{},got:{p:false,t:false,m:false},
  trWeek:monday(today),trDate:defaultTrainingDate(),draft:null,dirty:false,
  recapWeek:monday(today),convWeek:monday(today),
  matchEdit:null,pf:{key:"all",from:"",to:""},playerOpen:null,playerEdit:null,showBulk:false,sort:"cognome",pending:false,saving:false
};
try{const sv=JSON.parse(store.get("dfa-sess")||"null");if(sv&&sv.token){S.token=sv.token;S.me=sv;S.user=sv.user}}catch(e){}
const isAdmin=()=>!!(S.me&&S.me.admin);

/* ---------- calcoli ---------- */
function roster(){return Object.entries(S.players).map(([id,p])=>Object.assign({id},p)).filter(p=>p.attivo!==false)
  .sort((a,b)=>(a.cognome||"").localeCompare(b.cognome||"","it")||(a.nome||"").localeCompare(b.nome||"","it"))}
const fullName=p=>((p.cognome||"")+" "+(p.nome||"")).trim()||"Senza nome";
function presentAt(pid,date){const t=S.trainings[date];if(!t)return null;return !(t.assenti&&t.assenti[pid])}
function weekInfo(pid,mon){const ds=weekDays(mon);const marks=ds.map(d=>presentAt(pid,d));const count=marks.filter(x=>x===true).length;const reg=ds.filter(d=>S.trainings[d]).length;
  const gk=isGk(pid);const st=(count>=3||(gk&&count>=1))?"doppia":count===2?"conv":"non";return{marks,count,reg,st,gk}}
function isGk(pid){const p=S.players&&S.players[pid];return!!p&&(p.ruolo||"")==="Portiere"}
const ST={doppia:{l:"Convocabile 3/3 · doppia",c:"b-doppia",g:"Candidati doppia"},conv:{l:"Convocabile",c:"b-conv",g:"Convocabili"},non:{l:"Non convocabile",c:"b-non",g:"Non convocabili"}};
function playerStats(pid,from,to){
  const inR=d=>!!d&&(!from||d>=from)&&(!to||d<=to);
  const tr=Object.keys(S.trainings).filter(inR).sort();let pres=0;tr.forEach(d=>{if(presentAt(pid,d))pres++});
  const ms=Object.entries(S.matches).map(([id,m])=>Object.assign({id},m)).filter(m=>Object.keys(m.giocatori||{}).length>0).filter(m=>(!from&&!to)||inR(m.data)).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const wk=m=>iso(monday(parse(m.data)));const allW=new Set(ms.map(wk)),myW=new Set();
  let conv=0,played=0,min=0;const list=[];
  ms.forEach(m=>{const g=m.giocatori&&m.giocatori[pid];if(g){conv++;const mm=+g.min||0;if(!g.assente){played++;myW.add(wk(m))}min+=mm;list.push({m,min:mm,ass:!!g.assente})}});
  return{trTot:tr.length,pres,trPct:pct(pres,tr.length),mTot:ms.length,wTot:allW.size,wPlayed:myW.size,conv,played,mPct:pct(myW.size,allW.size),min,avg:played?Math.round(min/played):0,list,trList:tr.slice(-12).reverse()}
}
function certState(p){if(!p.certificato)return null;const d=parse(p.certificato);const days=Math.round((d-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/864e5);
  if(days<0)return{c:"b-non",l:"Certificato scaduto"};if(days<=30)return{c:"b-warn",l:"Certificato scade il "+fmtShort(p.certificato)};return null}

/* ---------- dati (Google Apps Script) ---------- */
const API_URL="https://script.google.com/macros/s/AKfycbwjW3wHmG-D-hBUNLaYV8n1e4DMhg47pa60nkjclMWsLE_6aq_aWsI604X17RzhfQqFqA/exec";
const gs=async(fn,...args)=>{
  let r;try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),redirect:"follow"})}catch(e){throw new Error("Nessuna connessione: riprova tra poco.")}
  let j;try{j=await r.json()}catch(e){throw new Error("Risposta non valida dal server.")}
  if(!j.ok)throw new Error(j.error||"Errore del server");return j.data};
function applyData(d){if(!d)return;S.players=d.players||{};S.trainings=d.trainings||{};S.matches=d.matches||{};S.got={p:true,t:true,m:true};S.dbState="ok";if(!S.dirty)S.draft=null}
function sessionLost(e){if(e&&String(e.message||e).indexOf("SESSIONE")>=0){S.user=null;S.me=null;S.token=null;store.set("dfa-sess",null);render();toast("Sessione scaduta: rientra con utente e password");return true}return false}
let loading=false,lastLoad=0;
async function initDb(){if(!S.token||loading)return;loading=true;
  try{applyData(await gs("getAll",S.token));lastLoad=Date.now();softRender()}
  catch(e){if(!sessionLost(e)){S.dbState=S.got.p?"slow":"error";render()}}
  finally{loading=false}}
setInterval(()=>{if(S.token&&!S.dirty&&!S.matchEdit&&!S.playerEdit&&document.visibilityState==="visible"&&Date.now()-lastLoad>55000)initDb()},15000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.token&&!S.dirty&&Date.now()-lastLoad>20000)initDb()});
const api={doc(path){const[col,id]=path.split("/");return ref(col,id)},collection(col){return{doc:(id)=>ref(col,id||null)}}};
function ref(col,id){const go=(op,data)=>gs("write",S.token,col,op,id,data||null).then(d=>{applyData(d);lastLoad=Date.now()});
  return{set:d=>go("set",d),update:d=>go("update",d),delete:()=>go("delete")}}
function softRender(){const a=document.activeElement;if(a&&a.closest&&a.closest("#main")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){S.pending=true;return}render()}
document.addEventListener("focusout",()=>{if(S.pending)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))){S.pending=false;render()}},50)});
async function write(fn,okMsg){if(S.saving){toast("Salvataggio in corso…");return false}
  S.saving=true;document.body.style.cursor="progress";try{await fn(api);if(okMsg)toast(okMsg);return true}
  catch(e){if(!sessionLost(e)){const m=String(e&&e.message||"").replace(/^Error:\s*/,"");toast(m&&m.length<120?m:"Salvataggio non riuscito, riprova")}return false}
  finally{S.saving=false;document.body.style.cursor=""}}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  document.body.classList.toggle("is-login",!S.user);
  if(!S.user){app.innerHTML=loginView();return}
  const u=S.me||{nome:""};
  const ICO={convocazioni:'<path d="M9 4.5h6M9 4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5M9 4.5H6.5A1.5 1.5 0 0 0 5 6v13.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H15m-6 8 2 2 4-4"/>',allenamenti:'<path d="M8 2v3M16 2v3M3.5 9h17M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 19 20.5H5A1.5 1.5 0 0 1 3.5 19V6A1.5 1.5 0 0 1 5 4.5Zm4 10 2 2 4-4"/>',recap:'<path d="M5 20V10m7 10V4m7 16v-7"/>',partite:'<circle cx="12" cy="12" r="9"/><path d="m12 8 3.5 2.5-1.3 4h-4.4l-1.3-4Zm0-6v6m3.5 2.5L21 9.8M14.2 14.5l3.2 4.4M9.8 14.5l-3.200 4.4M8.500 10.500 3 9.800"/>',rosa:'<circle cx="9" cy="8" r="3.500"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0M16 4.800a3.500 3.500 0 0 1 0 6.400M18.500 14.200A6.500 6.500 0 0 1 21.500 20"/>'};
  const tabs=[["allenamenti","Allenamenti","Allen."],["recap","Recap settimana","Recap"],["partite","Partite","Partite"],["convocazioni","Convocazioni","Convoc."],["rosa","Rosa e schede","Rosa"]];
  const navHtml=c=>`<nav class="tabs ${c}" role="tablist">${tabs.map(([k,l,sh])=>`<button role="tab" type="button" data-a="tab" data-v="${k}" aria-selected="${S.tab===k}"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg></span><span class="tl">${l}</span><span class="ts">${sh}</span></button>`).join("")}</nav>`;
  app.innerHTML=`<div class="bar"><div class="wrap"><img class="crest" src="${LOGO}" alt="Stemma DF Academy"><div class="team"><b>DF Academy</b><span>Annata 2018 · registro presenze</span></div>
    <div class="who"><span class="nm">${esc(((GRUPPI.find(g=>g[2]===S.user)||[])[1]||u.nome||"").toUpperCase())}</span><br><button data-a="logout" type="button">Esci</button></div></div>
    <div class="wrap">${navHtml("top")}</div></div>
    <main id="main" class="wrap">${statusNote()}${view()}<p class="ver">Versione app 18 · 9 nov 2026</p></main>${navHtml("bot")}`;
}
function statusNote(){
  if(S.dbState==="slow")return`<div class="note warn" style="margin-bottom:14px">Non riesco ad aggiornare i dati: controlla la connessione. Quello che vedi potrebbe non essere aggiornato.</div>`;
  if(S.dbState==="error")return`<div class="note warn" style="margin-bottom:14px">Non riesco a caricare i dati. Controlla la connessione e ricarica la pagina.</div>`;
  return"";
}
function view(){
  if(S.dbState==="loading"&&!S.got.p)return`<div class="loading">Carico rosa e presenze…</div>`;
  if(S.tab==="allenamenti")return trainingView();
  if(S.tab==="recap")return recapView();
  if(S.tab==="convocazioni")return convView();
  if(S.tab==="partite")return S.matchEdit?matchForm():matchesView();
  if(S.tab==="rosa")return S.playerOpen?playerCard(S.playerOpen):rosaView();

  return`<div class="stack"><div class="head"><div class="card-head"><div class="bigshirt num">${esc(p.numero||"–")}</div><div><h2>${esc(fullName(p))}</h2><p class="sub">${esc(p.ruolo||"Ruolo non indicato")}${p.nascita?" · nato il "+esc(fmtShort(p.nascita)):""}</p></div></div>

    <div class="row"><span class="badge ${ST[w.st].c}">Questa settimana: ${w.count}/3 · ${ST[w.st].l}</span>${c?`<span class="badge ${c.c}">${esc(c.l)}</span>`:p.certificato?`<span class="badge b-conv">Certificato valido fino al ${esc(fmtShort(p.certificato))}</span>`:""}</div>
    ${periodBar()}
    <div class="tiles">${tile("Presenza allenamenti",s.trPct+"%",s.pres+" su "+s.trTot+" allenamenti"+(filt?" nel periodo":""),s.trPct,filt?T.trPct+"% ("+T.pres+" su "+T.trTot+")":"")}
      ${tile("Presenza partite",s.mPct+"%","presente "+s.wPlayed+" weekend su "+s.wTot+" · "+s.played+" partite",s.mPct,filt?T.mPct+"% ("+T.wPlayed+" weekend su "+T.wTot+")":"")}
      ${tile("Minuti giocati",s.min+"'","media "+s.avg+"' a partita",null,filt?T.min+"' · media "+T.avg+"'":"")}</div>
    ${p.note?`<div class="panel"><h3>Note del mister</h3><p style="margin:0;white-space:pre-wrap">${esc(p.note)}</p></div>`:""}
    <div class="panel"><h3>${filt?"Allenamenti nel periodo":"Ultimi allenamenti"}</h3>${s.trList.length?`<div class="hist">${s.trList.map(d=>{const t=S.trainings[d];const m=t.assenti&&t.assenti[pid];return`<span class="tick ${m?"n":"y"}" title="${esc(fmtDay(d))}${m?" · "+esc(m):""}">${esc(fmtShort(d))}</span>`}).join("")}</div>
      ${(()=>{const mot={};s.trList.forEach(d=>{const m=S.trainings[d].assenti&&S.trainings[d].assenti[pid];if(m)mot[m]=(mot[m]||0)+1});const k=Object.keys(mot);return k.length?`<p class="sub">Assenze: ${k.map(x=>esc(x)+" "+mot[x]).join(" · ")}</p>`:""})()}`:`<p class="sub" style="margin:0">Nessun allenamento registrato.</p>`}</div>
    <div><h3>Partite</h3>${s.list.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Avversario</th><th>Minuti</th></tr></thead><tbody>
      ${s.list.map(x=>{const dur=+x.m.durata||45;return`<tr><td class="num">${esc(fmtShort(x.m.data))}</td><td>${esc(x.m.avversario||"—")}</td><td><div class="minbar"><div class="track"><i style="width:${Math.min(100,pct(x.min,dur))}%"></i></div><span class="num">${x.ass?"assente":x.min+"'"}</span></div></td></tr>`}).join("")}</tbody></table></div>`
      :`<p class="sub" style="margin:0">${filt?"Nessuna convocazione nel periodo.":"Ancora nessuna convocazione."}</p>`}</div></div>`;
}
function periodBar(){
  const pf=S.pf;const months=[...new Set(Object.keys(S.trainings).concat(Object.values(S.matches).map(m=>m.data||"")).filter(Boolean).map(d=>d.slice(0,7)))].sort();
  const mlab=k=>{const[y,m]=k.split("-").map(Number);const l=new Date(y,m-1,1).toLocaleDateString("it-IT",{month:"long"});return l.charAt(0).toUpperCase()+l.slice(1)};
  const chip=(key,l)=>`<button type="button" class="chip pchip" data-a="period" data-v="${key}" aria-pressed="${pf.key===key}">${l}</button>`;
  return`<div class="panel stack" style="gap:10px"><h3 style="margin:0">Periodo</h3><div class="row" style="gap:6px">${chip("all","Tutta la stagione")}${chip("4w","Ultime 4 settimane")}${months.map(k=>chip("m"+k,mlab(k))).join("")}</div>
    <div class="row" style="gap:10px"><div class="field" style="flex:1;min-width:130px"><label for="pf_from">Dal</label><input id="pf_from" type="date" data-pf="from" value="${esc(pf.from)}"></div><div class="field" style="flex:1;min-width:130px"><label for="pf_to">Al</label><input id="pf_to" type="date" data-pf="to" value="${esc(pf.to)}"></div></div></div>`}
function playerEditForm(pid,p){const adm=isAdmin();
  return`<form class="stack" id="playerForm" data-v="${pid}"><div class="head"><div><h2>${adm?"Modifica giocatore":"Note sul giocatore"}</h2><p class="sub">${esc(fullName(p))}</p></div></div>
    <div class="panel grid2">${adm?`
      <div class="field"><label for="pe_c">Cognome</label><input id="pe_c" name="cognome" value="${esc(p.cognome)}" required></div>
      <div class="field"><label for="pe_n">Nome</label><input id="pe_n" name="nome" value="${esc(p.nome)}"></div>
      <div class="field"><label for="pe_num">Numero</label><input id="pe_num" name="numero" inputmode="numeric" value="${esc(p.numero)}"></div>
      <div class="field"><label for="pe_g">Gruppo mister</label><select id="pe_g" name="gruppo"><option value="">—</option>${GRUPPI.map(g=>`<option value="${g[0]}" ${p.gruppo===g[0]?"selected":""}>${g[1]}</option>`).join("")}</select></div>
      <div class="field"><label for="pe_r">Ruolo</label><select id="pe_r" name="ruolo">${ROLES.map(r=>`<option value="${r}" ${p.ruolo===r?"selected":""}>${r||"—"}</option>`).join("")}</select></div>
      <div class="field"><label for="pe_b">Data di nascita</label><input id="pe_b" name="nascita" type="date" value="${esc(p.nascita)}"></div>
      <div class="field"><label for="pe_cm">Certificato medico valido fino al</label><input id="pe_cm" name="certificato" type="date" value="${esc(p.certificato)}"></div>`:""}
      <div class="field" style="grid-column:1/-1"><label for="pe_note">Note del mister</label><textarea id="pe_note" name="note" rows="4">${esc(p.note)}</textarea></div></div>
    <div class="row"><button class="btn primary" type="submit">Salva</button><button class="btn" type="button" data-a="canceledit">Annulla</button>${adm?`<span style="flex:1"></span><button class="btn danger" type="button" data-a="delplayer" data-v="${pid}">${S.confirmDel===pid?"Conferma: togli dalla rosa":"Togli dalla rosa"}</button>`:""}</div></form>`}

/* ---------- eventi ---------- */
document.addEventListener("submit",async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==="loginForm"){const u=f.username.value.trim().toLowerCase();const p=f.password.value;const err=document.getElementById("lerr");
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Accesso…";err.textContent="";
    try{const r=await gs("login",u,p);S.token=r.token;S.me=r;S.user=r.user;store.set("dfa-sess",JSON.stringify(r));S.dbState="loading";render();initDb()}
    catch(x){err.textContent=String(x&&x.message||"Accesso non riuscito").replace(/^Error:\s*/,"");btn.disabled=false;btn.textContent="Entra"}
    return}
  if(f.id==="bulkForm"){const lines=f.querySelector("#bulk").value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return;
    const list=lines.map(l=>{const m=l.match(/^(\d{1,3})\s+(.*)$/);const rest=(m?m[2]:l).split(/\s+/);return{numero:m?m[1]:"",cognome:rest[0]||"",nome:rest.slice(1).join(" ")}});
    const ok=await write(async()=>{applyData(await gs("aggiungiGiocatori",S.token,list));lastLoad=Date.now()},lines.length+" giocatori aggiunti");
    if(ok){S.showBulk=false;render()}return}
  if(f.id==="playerForm"){const pid=f.dataset.v;const fd=new FormData(f);const data={note:(fd.get("note")||"").toString()};
    if(isAdmin())["cognome","nome","numero","ruolo","gruppo","nascita","certificato"].forEach(k=>data[k]=(fd.get(k)||"").toString().trim());
    const ok=await write(db=>db.doc("players/"+pid).update(data),"Scheda salvata");if(ok){S.playerEdit=null;S.pending=false;render()}}
});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]");if(!el||el.tagName==="SELECT")return;const a=el.dataset.a,v=el.dataset.v;
  if(el.type==="checkbox"&&a!=="conv")return;
  switch(a){
  case"logout":{const t=S.token;S.user=null;S.me=null;S.token=null;store.set("dfa-sess",null);render();if(t)gs("logout",t).catch(()=>{});break}
  case"tab":S.tab=v;S.matchEdit=null;S.playerOpen=null;S.playerEdit=null;window.scrollTo(0,0);render();break;
  case"gorecap":S.tab="recap";S.recapWeek=S.trWeek;render();break;
  case"trweek":if(S.dirty&&!confirmLeave(el))return;S.trWeek=addDays(S.trWeek,7*v);const ds=weekDays(S.trWeek);S.trDate=ds.filter(d=>d<=todayIso).pop()||ds[0];S.draft=null;S.dirty=false;render();break;
  case"trday":if(S.dirty&&v!==S.trDate&&!confirmLeave(el))return;S.trDate=v;S.draft=null;S.dirty=false;render();break;
  case"pres":{const d=getDraft();delete d.assenti[v];S.dirty=true;render();break}
  case"abs":{const d=getDraft();if(!d.assenti[v])d.assenti[v]="Assente";S.dirty=true;render();break}
  case"motivo":{const d=getDraft();d.assenti[v]=d.assenti[v]===el.dataset.m?"Assente":el.dataset.m;S.dirty=true;render();break}
  case"allpres":{const d=getDraft();d.assenti={};S.dirty=true;render();break}
  case"undo":S.draft=null;S.dirty=false;render();break;
  case"savetr":{const d=getDraft();const valid={};roster().forEach(p=>{if(d.assenti[p.id])valid[p.id]=d.assenti[p.id]});
    const ok=await write(db=>db.doc("trainings/"+d.date).set({data:d.date,assenti:valid,da:((S.me&&S.me.nome)||""),ts:Date.now()}),"Allenamento di "+fmtDay(d.date)+" salvato");
    if(ok){S.dirty=false;S.draft=null;render()}break}
  case"deltr":if(el.dataset.c!=="1"){el.dataset.c="1";el.textContent="Conferma eliminazione";return}
    if(await write(db=>db.doc("trainings/"+S.trDate).delete(),"Allenamento eliminato")){S.draft=null;S.dirty=false;render()}break;
  case"cvweek":S.convWeek=addDays(S.convWeek,7*v);render();break;
  case"gomatch":{S.tab="partite";S.detOpen=false;const m=S.matches[v];S.matchEdit=JSON.parse(JSON.stringify(Object.assign({id:v,durata:45,giocatori:{}},m)));window.scrollTo(0,0);render();break}
  case"pdfconv":await exportPdf(weekMatches(S.convWeek),"Convocazioni · weekend "+fmtShort(iso(addDays(S.convWeek,5)))+" – "+fmtShort(iso(addDays(S.convWeek,6))),"convocazioni-"+iso(S.convWeek)+".pdf");break;
  case"rcweek":S.recapWeek=addDays(S.recapWeek,7*v);render();break;
  case"copyconv":{const m=S.matchEdit;if(!m)break;if(!Object.keys(m.giocatori||{}).length){toast("Nessun convocato da copiare");break}const txt=convText(m);try{await navigator.clipboard.writeText(txt);toast("Convocati copiati: incollali nel gruppo")}catch(x){showCopyFallback(txt)}break}
  case"copyrecap":{const txt=recapText();try{await navigator.clipboard.writeText(txt);toast("Recap copiato: incollalo nel gruppo")}catch(x){showCopyFallback(txt)}break}
  case"detopen":S.detOpen=!S.detOpen;render();break;
  case"mtab":{S.mTab=v;render();break}
  case"setf":{const m=S.matchEdit;if(m){m[el.dataset.k]=v;render()}break}
  case"expimg":{const m=S.matchEdit;if(!m)break;if(!Object.keys(m.giocatori||{}).length){toast("Nessun convocato da esportare");break}await exportImg(m);break}
  case"newmatch":S.detOpen=false;S.matchEdit=newMatchDraft();window.scrollTo(0,0);render();break;
  case"openmatch":{S.detOpen=false;const m=S.matches[v];S.matchEdit=JSON.parse(JSON.stringify(Object.assign({id:v,durata:45,giocatori:{}},m)));window.scrollTo(0,0);render();break}
  case"closematch":S.matchEdit=null;S.pending=false;render();break;
  case"conv":{const m=S.matchEdit;if(el.checked)m.giocatori[v]={min:"",gol:0};else delete m.giocatori[v];S.pending=false;render();break}
  case"mpres":{const g=S.matchEdit.giocatori[v];if(g){g.assente=false;S.pending=false;render()}break}
  case"mabs":{const g=S.matchEdit.giocatori[v];if(g){g.assente=true;g.min="";g.gol=0;S.pending=false;render()}break}
  case"fullmin":{const m=S.matchEdit;if(m.giocatori[v]){m.giocatori[v].min=+m.durata||45;const i=document.querySelector(`[data-pm="${v}"]`);if(i)i.value=m.giocatori[v].min}break}
  case"gtoggle":{S.gOpen=S.gOpen||{};const cur=(v in S.gOpen)?S.gOpen[v]:(v===gOf(S.user));S.gOpen[v]=!cur;render();break}
  case"rcopen":S.rcOpen=(!v||S.rcOpen===v)?null:v;render();break
  case"rcconv":toggleConv(v,el.dataset.m);break
  case"savematch":{const m=S.matchEdit;if(!m.data){toast("Inserisci la data della partita");return}
    const gi={};Object.entries(m.giocatori).forEach(([pid,g])=>{if(S.players[pid])gi[pid]={min:g.assente?0:Math.max(0,+g.min||0),assente:!!g.assente,gol:g.assente?0:Math.max(0,+g.gol||0)}});
    const body={data:m.data,ora:m.ora||"",mister:m.mister||"",avversario:(m.avversario||"").trim(),campo:m.campo,luogo:(m.luogo||"").trim(),dirigente:(m.dirigente||"").trim(),golFatti:m.golFatti===""?"":+m.golFatti,golSubiti:m.golSubiti===""?"":+m.golSubiti,durata:+m.durata||45,giocatori:gi,da:((S.me&&S.me.nome)||""),ts:Date.now()};
    const ok=await write(db=>(m.id?db.doc("matches/"+m.id):db.collection("matches").doc()).set(body),"Partita salvata");if(ok){S.matchEdit=null;S.pending=false;render()}break}
  case"delmatch":if(el.dataset.c!=="1"){el.dataset.c="1";el.textContent="Conferma eliminazione";return}
    if(await write(db=>db.doc("matches/"+S.matchEdit.id).delete(),"Partita eliminata")){S.matchEdit=null;render()}break;
  case"export":exportSeason();break;
  case"period":{if(v==="all")S.pf={key:"all",from:"",to:""};else if(v==="4w")S.pf={key:"4w",from:iso(addDays(today,-27)),to:todayIso};
    else{const[y,m]=v.slice(1).split("-").map(Number);S.pf={key:v,from:iso(new Date(y,m-1,1)),to:iso(new Date(y,m,0))}}render();break}
  case"addplayer":S.showBulk=true;render();setTimeout(()=>{const t=document.getElementById("bulk");t&&t.focus()},30);break;
  case"closebulk":S.showBulk=false;render();break;
  case"openplayer":S.playerOpen=v;S.playerEdit=null;window.scrollTo(0,0);render();break;
  case"closeplayer":S.playerOpen=null;render();break;
  case"editplayer":S.playerEdit=S.playerOpen;S.confirmDel=null;render();break;
  case"canceledit":S.playerEdit=null;S.pending=false;render();break;
  case"delplayer":if(S.confirmDel!==v){S.confirmDel=v;el.textContent="Conferma: togli dalla rosa";return}
    if(await write(db=>db.doc("players/"+v).update({attivo:false}),"Giocatore tolto dalla rosa")){S.playerOpen=null;S.playerEdit=null;S.pending=false;render()}break;
  }
});
/* ---------- esportazione Excel ---------- */
function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("xlsx"));sc.onerror=()=>rej(new Error("xlsx"));document.head.appendChild(sc)})}
function seasonLabel(){const y=today.getMonth()>=7?today.getFullYear():today.getFullYear()-1;return y+"-"+String(y+1).slice(2)}
async function exportSeason(){
  if(S.exporting)return;S.exporting=true;render();
  try{
    const X=await loadXLSX();const ps=roster();const tr=Object.keys(S.trainings).sort();
    const ms=Object.entries(S.matches).map(([id,m])=>Object.assign({id},m)).sort((a,b)=>(a.data||"").localeCompare(b.data||""));
    const wb=X.utils.book_new();
    const add=(name,rows,widths)=>{const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(w=>({wch:w}));if(rows.length>1)ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:0,c:rows[0].length-1}})};X.utils.book_append_sheet(wb,ws,name)};
    const dlab=d=>{const x=parse(d);return pad(x.getDate())+"/"+pad(x.getMonth()+1)};
    /* 1 riepilogo */
    const r1=[["Cognome","Nome","Numero","Ruolo","Allenamenti presenti","Allenamenti totali","% allenamenti","Partite giocate","Convocazioni","Weekend in campo","Weekend con partite","% partite (weekend)","Minuti totali","Media minuti","Certificato medico"]];
    ps.forEach(p=>{const s=playerStats(p.id);r1.push([p.cognome||"",p.nome||"",p.numero||"",p.ruolo||"",s.pres,s.trTot,s.trPct,s.played,s.conv,s.wPlayed,s.wTot,s.mPct,s.min,s.avg,p.certificato?dlab(p.certificato)+"/"+p.certificato.slice(0,4):""])});
    add("Riepilogo",r1,[16,12,8,14,10,10,10,10,10,10,10,12,10,10,14]);
    /* 2 allenamenti */
    const r2=[["Giocatore"].concat(tr.map(d=>DAYNAMES[[1,3,5].indexOf(parse(d).getDay())]?(DAYNAMES[[1,3,5].indexOf(parse(d).getDay())]+" "+dlab(d)):dlab(d))).concat(["Presenze","%"])];
    ps.forEach(p=>{let n=0;const row=[fullName(p)];tr.forEach(d=>{const m=S.trainings[d].assenti&&S.trainings[d].assenti[p.id];if(!m)n++;row.push(m?(m==="Assente"?"A":"A · "+m):"P")});row.push(n,pct(n,tr.length));r2.push(row)});
    add("Allenamenti",r2,[22].concat(tr.map(()=>11)).concat([9,6]));
    /* 3 recap settimanale */
    const weeks=[...new Set(tr.map(d=>iso(monday(parse(d)))))].sort();
    const r3=[["Giocatore"].concat(weeks.map(w=>"Sett. "+dlab(w))).concat(["Settimane 3/3","Settimane 2/3","Settimane sotto 2"])];
    ps.forEach(p=>{const row=[fullName(p)];let a=0,b=0,c=0;weeks.forEach(w=>{const wi=weekInfo(p.id,parse(w));row.push(wi.count+"/3");wi.st==="doppia"?a++:wi.st==="conv"?b++:c++});row.push(a,b,c);r3.push(row)});
    add("Recap settimanale",r3,[22].concat(weeks.map(()=>11)).concat([13,13,15]));
    /* 4 partite */
    const r4=[["Data","Avversario","Campo","Gol fatti","Gol subiti","Durata (min)","Convocati"]];
    ms.forEach(m=>{const gi=m.giocatori||{};
      r4.push([m.data?dlab(m.data)+"/"+m.data.slice(0,4):"",m.avversario||"",m.campo==="trasferta"?"Trasferta":"Casa",m.golFatti===""?"":m.golFatti,m.golSubiti===""?"":m.golSubiti,+m.durata||"",Object.keys(gi).length])});
    add("Partite",r4,[12,24,10,9,9,11,10]);
    /* 5 minutaggio */
    const r5=[["Giocatore"].concat(ms.map(m=>(m.data?dlab(m.data):"")+" "+(m.avversario||""))).concat(["Totale minuti"])];
    ps.forEach(p=>{let t=0;const row=[fullName(p)];ms.forEach(m=>{const x=m.giocatori&&m.giocatori[p.id];if(x){t+=+x.min||0;row.push(+x.min||0)}else row.push("")});row.push(t);r5.push(row)});
    add("Minutaggio",r5,[22].concat(ms.map(()=>14)).concat([12]));
    const buf=X.write(wb,{bookType:"xlsx",type:"array"});
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="DF Academy 2018 - stagione "+seasonLabel()+".xlsx";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    toast("File Excel salvato");
  }catch(e){const c=e&&e.code;if(c==="declined"){}else if(c==="rate_limited")toast("C'è già un salvataggio in corso");else if(e&&e.message==="xlsx")toast("Non riesco a caricare il generatore Excel: controlla la connessione");else toast("Esportazione non riuscita")}
  finally{S.exporting=false;render()}
}
function confirmLeave(el){if(el.dataset.c==="1")return true;el.dataset.c="1";toast("Hai modifiche non salvate: tocca di nuovo per scartarle");setTimeout(()=>{delete el.dataset.c},3000);return false}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr.click")){e.target.click()}});
document.addEventListener("input",e=>{const t=e.target;const m=S.matchEdit;
  if(m&&t.dataset.f){m[t.dataset.f]=t.value;return}
  if(m&&t.dataset.pm&&m.giocatori[t.dataset.pm]){m.giocatori[t.dataset.pm].min=t.value;return}
  if(m&&t.dataset.pg&&m.giocatori[t.dataset.pg]){m.giocatori[t.dataset.pg].gol=t.value;return}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a==="sort"){S.sort=t.value;render()}
  if(t.dataset.pf){S.pf[t.dataset.pf]=t.value;S.pf.key=(S.pf.from||S.pf.to)?"custom":"all";S.pending=false;render()}
  if(S.matchEdit&&t.dataset.f==="data"){S.pending=false;render()}});
function showCopyFallback(txt){const main=document.getElementById("main");const box=document.createElement("div");box.className="panel stack";
  box.innerHTML=`<h3>Seleziona e copia il testo</h3><textarea id="copybox" rows="10" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px"></textarea>`;
  main.prepend(box);const ta=box.querySelector("textarea");ta.value=txt;ta.focus();ta.select()}

S.dl=true;render();initDb();
})();
</script>
