name: Pubblica sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pubblica-sito
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Annulla le pubblicazioni rimaste bloccate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git log -30 --format=%H); do
            gh api -X POST repos/${{ github.repository }}/pages/deployments/$sha/cancel >/dev/null 2>&1 && echo "annullata $sha" || true
          done
          sleep 15
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
